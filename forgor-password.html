<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elied - Recuperar contraseña</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a href="index.html" class="logo">Elied</a>
        <nav class="main-nav">
          <ul>
            <li><a href="index.html">Inicio</a></li>
            <li><a href="catalog.html">Catálogo</a></li>
            <li><a href="about.html">Nosotros</a></li>
            <li><a href="contact.html">Contacto</a></li>
            <li><a href="login.html" class="btn-login">Iniciar sesión</a></li>
          </ul>
        </nav>
        <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
      </div>
    </header>
    <main>
      <section class="page-intro">
        <div class="wrap">
          <h1 class="page-title">Recupera tu contraseña</h1>
          <p class="page-subtitle">Te enviaremos un enlace para restablecerla.</p>
        </div>
      </section>
      <section class="auth-content">
        <div class="wrap auth-wrap">
          <form id="forgot-form" class="auth-form">
            <div class="field">
              <label for="correo">Correo</label>
              <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>
            </div>
            <button type="submit" class="btn-submit">Enviar enlace</button>
            <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
            <p class="auth-alt"><a href="login.html">Regresar a inicio de sesión</a></p>
          </form>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="wrap footer-bottom">
        <span class="logo">Elied</span>
        <span>&copy; 2026 Elied.</span>
      </div>
    </footer>
    <script src="js/nav.js"></script>
    <script src="js/forgor-password.js"></script>
  </body>
</html>
