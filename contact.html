<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elied - Contacto</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a href="index.html" class="logo">Elied</a>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="catalog.html">Catálogo</a></li>
          <li><a href="about.html">Nosotros</a></li>
          <li><a href="contact.html" class="active">Contacto</a></li>
          <li><a href="login.html" class="btn-login">Iniciar sesión</a></li>
        </ul>
      </nav>
      <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
    </div>
  </header>
  <main>
    <section class="page-intro">
      <div class="wrap">
        <h1 class="page-title">Contacto</h1>
        <p class="page-subtitle">¿Tienes dudas o comentarios? Escríbenos.</p>
      </div>
    </section>
    <section class="contact-content">
      <div class="wrap contact-grid">
        <div class="contact-form-block">
          <form id="contact-form" class="contact-form" novalidate>
            <div class="field">
              <label for="nombre">Nombre</label>
              <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
            </div>
            <div class="field">
              <label for="correo">Correo</label>
              <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>
            </div>
            <div class="field">
              <label for="mensaje">Mensaje</label>
              <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí" required></textarea>
            </div>
            <button type="submit" class="btn-submit">Enviar</button>
            <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
          </form>
        </div>
        <div class="contact-info-block">
          <h2>Síguenos</h2>
          <p class="contact-note">También puedes encontrarnos en nuestras redes sociales.</p>
          <ul class="social-links">
            <li>
              <a href="poeoquito.html" aria-label="Instagram">
                <img src="https://cdn.simpleicons.org/instagram/9c8b6e" width="22" height="22" alt="">
                <span>Instagram</span>
              </a>
            </li>
            <li>
              <a href="poeoquito.html" aria-label="Facebook">
                <img src="https://cdn.simpleicons.org/facebook/9c8b6e" width="22" height="22" alt="">
                <span>Facebook</span>
              </a>
            </li>
            <li>
              <a href="poeoquito.html" aria-label="WhatsApp">
                <img src="https://cdn.simpleicons.org/whatsapp/9c8b6e" width="22" height="22" alt="">
                <span>WhatsApp</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="wrap footer-bottom">
      <span class="logo">Elied</span>
      <span>&copy; 2026 Elied.</span>
    </div>
  </footer>
  <script src="js/contact.js"></script>
</body>
</html>
