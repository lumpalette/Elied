<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elied - Comunidad</title>
    <link rel="stylesheet" href="../../shared/styles/base.css">
    <link rel="stylesheet" href="community.css">
  </head>
  <body>
    <site-header root="../../" active="community"></site-header>
    <main>
      <section class="page-intro">
        <div class="wrap">
          <h1 class="page-title">Comunidad</h1>
          <p class="page-subtitle">Cuéntanos qué te parecen nuestras prendas y lee lo que opinan otras personas.</p>
        </div>
      </section>

      <section class="community-content">
        <div class="wrap community-grid">
          <div class="card community-form-card">
            <h2>Deja tu comentario</h2>
            <form id="comment-form">
              <div class="field">
                <label for="comment-author">Nombre*</label>
                <input type="text" id="comment-author" name="nombre" placeholder="Tu nombre" required>
              </div>
              <div class="field">
                <label for="comment-rating">Valoración</label>
                <select id="comment-rating" name="valoracion">
                  <option value="5">★★★★★ Excelente</option>
                  <option value="4">★★★★☆ Muy bien</option>
                  <option value="3">★★★☆☆ Regular</option>
                  <option value="2">★★☆☆☆ Mejorable</option>
                  <option value="1">★☆☆☆☆ Malo</option>
                </select>
              </div>
              <div class="field">
                <label for="comment-text">Comentario*</label>
                <textarea id="comment-text" name="comentario" rows="4" placeholder="Escribe tu comentario aquí" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Publicar</button>
              <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
            </form>
          </div>

          <div class="community-list">
            <div class="community-list-heading">
              <h2>Comentarios</h2>
              <p id="comment-count" class="community-count" aria-live="polite"></p>
            </div>
            <ul class="comment-list" id="comment-list"></ul>
          </div>
        </div>
      </section>
    </main>
    <site-footer></site-footer>

    <script src="../../components/site-header/site-header.js" defer></script>
    <script src="../../components/site-footer/site-footer.js" defer></script>
    <script src="../../components/comment-card/comment-card.js" defer></script>
    <script src="community.js" defer></script>
  </body>
</html>
