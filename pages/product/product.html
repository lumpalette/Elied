<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elied, ropa y accesorios</title>
    <link rel="stylesheet" href="../../shared/styles/base.css">
    <link rel="stylesheet" href="product.css">
  </head>
  <body>
    <site-header root="../../" active="catalog"></site-header>
    <main>
      <section class="product-detail-content">
        <div class="wrap product-detail-grid" id="product-detail">
          <div class="thumbnail" id="product-thumbnail"></div>
          <div class="product-detail-info">
            <p class="product-detail-category" id="product-category"></p>
            <h1 class="product-detail-name" id="product-name"></h1>
            <p class="product-detail-price" id="product-price"></p>
            <p class="product-detail-desc" id="product-desc"></p>

            <div class="product-detail-qty">
              <span class="qty-label" id="qty-label">Cantidad</span>
              <div class="qty-selector" role="group" aria-labelledby="qty-label">
                <button class="qty-btn" id="qty-decrease" aria-label="Quitar una unidad">−</button>
                <span class="qty-value" id="qty-value" aria-live="polite">1</span>
                <button class="qty-btn" id="qty-increase" aria-label="Agregar una unidad">+</button>
              </div>
            </div>

            <div class="product-detail-actions">
              <a href="../cart/cart.html" class="btn btn-primary" id="add-to-cart">Agregar al carrito</a>
              <a href="../catalog/catalog.html" class="btn btn-sm">Regresar al catálogo</a>
            </div>
          </div>
        </div>
      </section>

      <section class="product-related" id="product-related" hidden>
        <div class="wrap">
          <h2 class="related-title">También te puede interesar</h2>
          <ul class="product-grid" id="related-grid"></ul>
        </div>
      </section>
    </main>
    <site-footer></site-footer>

    <script src="../../components/site-header/site-header.js" defer></script>
    <script src="../../components/site-footer/site-footer.js" defer></script>
    <script src="../../shared/product_data.js" defer></script>
    <script src="../../components/product-card/product-card.js" defer></script>
    <script src="product.js" defer></script>
  </body>
</html>
