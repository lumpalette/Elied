<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elied - Mi perfil</title>
    <link rel="stylesheet" href="../../shared/base.css">
    <link rel="stylesheet" href="profile.css">
  </head>
  <body>
    <site-header root="../../" active="profile"></site-header>
    <main>
      <section class="profile-content">
        <div class="wrap">
          <div class="profile-card card">
            <div class="profile-header">
              <div class="profile-avatar">B</div>
              <div>
                <h1 class="profile-name">Betabel</h1>
                <p class="profile-email">poeoquito.bb@ejemplo.com</p>
              </div>
            </div>
            <div class="profile-grid">
              <div class="profile-block">
                <h2>Mis datos</h2>
                <dl class="data-list">
                  <div class="info">
                    <dt>Nombre</dt>
                    <dd>Betabel</dd>
                  </div>
                  <div class="info">
                    <dt>Correo</dt>
                    <dd>poeoquito.bb@ejemplo.com</dd>
                  </div>
                </dl>
              </div>
              <div class="profile-block">
                <h2>Mis compras</h2>
                <p class="profile-placeholder">Próximamente</p>
              </div>
            </div>

            <button id="logout-btn" class="btn btn-sm">Cerrar sesión</button>
          </div>
        </div>
      </section>
    </main>
    <site-footer></site-footer>

    <script src="../../components/site-header/site-header.js" defer></script>
    <script src="../../components/site-footer/site-footer.js" defer></script>
    <script src="profile.js" defer></script>
  </body>
</html>
