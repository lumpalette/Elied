<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elied, ropa y accesorios</title>
    <link rel="stylesheet" href="../../shared/base.css">
    <link rel="stylesheet" href="catalog.css">
  </head>
  <body>
    <site-header root="../../" active="catalog"></site-header>
    <main>
      <section class="page-intro">
        <div class="wrap">
          <h1 class="page-title">Catálogo</h1>
          <p class="page-subtitle">Ropa casual pensada para el día a día.</p>
        </div>
      </section>
      <section class="catalog-content">
        <div class="wrap">
          <div class="catalog-toolbar">
            <div class="filter-chips" role="group" aria-label="Filtrar por categoría">
              <button class="chip is-active" data-category="all" aria-pressed="true">Todos</button>
              <button class="chip" data-category="tshirts" aria-pressed="false">Playeras</button>
              <button class="chip" data-category="blouses" aria-pressed="false">Blusas</button>
              <button class="chip" data-category="pants" aria-pressed="false">Pantalones</button>
              <button class="chip" data-category="dresses" aria-pressed="false">Vestidos</button>
              <button class="chip" data-category="accessories" aria-pressed="false">Accesorios</button>
            </div>
            <div class="field catalog-sort">
              <label for="sort">Ordenar por</label>
              <select id="sort">
                <option value="default">Destacados</option>
                <option value="price-asc">Precio: menor a mayor</option>
                <option value="price-desc">Precio: mayor a menor</option>
                <option value="name">Nombre (A–Z)</option>
              </select>
            </div>
          </div>
          <p id="catalog-count" class="catalog-count" aria-live="polite"></p>
          <ul class="product-grid" id="catalog-grid"></ul>
          <p id="catalog-empty" class="catalog-empty" hidden>No hay productos en esta categoría por ahora.</p>
        </div>
      </section>
    </main>
    <site-footer></site-footer>

    <script src="../../components/site-header/site-header.js" defer></script>
    <script src="../../components/site-footer/site-footer.js" defer></script>
    <script src="../../shared/product_data.js" defer></script>
    <script src="../../components/product-card/product-card.js" defer></script>
    <script src="catalog.js" defer></script>
  </body>
</html>
