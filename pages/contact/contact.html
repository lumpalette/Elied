<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elied, ropa y accesorios</title>
    <link rel="stylesheet" href="../../shared/base.css">
    <link rel="stylesheet" href="contact.css">
  </head>
  <body>
    <site-header root="../../" active="contact"></site-header>
    <main>
      <section class="page-intro">
        <div class="wrap">
          <h1 class="page-title">Contacto</h1>
          <p class="page-subtitle">¿Tienes dudas o comentarios? Escríbenos.</p>
        </div>
      </section>
      <section class="contact-content">
        <div class="wrap contact-grid">
          <div class="card">
            <form id="contact-form">
              <div class="field">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
              </div>
              <div class="field">
                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com" required>
              </div>
              <div class="field">
                <label for="mensaje">Mensaje</label>
                <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje aquí" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Enviar</button>
              <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
            </form>
          </div>
          <div class="contact-info-block">
            <h2>Síguenos</h2>
            <p class="contact-note">También puedes encontrarnos en nuestras redes sociales.</p>
            <ul class="social-links">
              <li>
                <a href="../poeoquito/poeoquito.html" aria-label="Instagram">
                  <span class="social-icon social-icon-instagram"></span>
                  <span>Instagram</span>
                </a>
              </li>
              <li>
                <a href="../poeoquito/poeoquito.html" aria-label="Facebook">
                  <span class="social-icon social-icon-facebook"></span>
                  <span>Facebook</span>
                </a>
              </li>
              <li>
                <a href="../poeoquito/poeoquito.html" aria-label="WhatsApp">
                  <span class="social-icon social-icon-whatsapp"></span>
                  <span>WhatsApp</span>
                </a>
              </li>
            </ul>
          </div>
        </div>
      </section>
    </main>
    <site-footer></site-footer>

    <script src="../../components/site-header/site-header.js" defer></script>
    <script src="../../components/site-footer/site-footer.js" defer></script>
    <script src="contact.js" defer></script>
  </body>
</html>
