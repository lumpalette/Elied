<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elied, ropa y accesorios</title>
    <link rel="stylesheet" href="../../shared/base.css">
    <link rel="stylesheet" href="../../components/page-intro/page-intro.css">
    <link rel="stylesheet" href="../../components/auth-form/auth-form.css">
  </head>
  <body>
    <site-header root="../../"></site-header>
    <main>
      <section class="page-intro">
        <div class="wrap">
          <h1 class="page-title">Crea tu cuenta</h1>
          <p class="page-subtitle">Regístrate para guardar tus compras y publicaciones.</p>
        </div>
      </section>
      <section class="auth-content">
        <div class="wrap auth-wrap">
          <form id="register-form" class="auth-form card">
            <div class="field">
              <label for="nombre">Nombre</label>
              <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
            </div>
            <div class="field">
              <label for="correo">Correo</label>
              <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required>
            </div>
            <div class="field">
              <label for="password">Contraseña</label>
              <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Registrarme</button>
            <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
            <p class="auth-alt">¿Ya tienes cuenta? <a href="../login/login.html">Inicia sesión</a></p>
          </form>
        </div>
      </section>
    </main>
    <site-footer></site-footer>

    <script src="../../components/site-header/site-header.js" defer></script>
    <script src="../../components/site-footer/site-footer.js" defer></script>
    <script src="register.js" defer></script>
  </body>
</html>
