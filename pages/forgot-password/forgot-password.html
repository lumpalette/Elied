<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elied, ropa y accesorios</title>
    <link rel="stylesheet" href="../../shared/base.css">
    <link rel="stylesheet" href="../../components/page-intro/page-intro.css">
    <link rel="stylesheet" href="../../components/auth-form/auth-form.css">
  </head>
  <body>
    <site-header root="../../"></site-header>
    <main>
      <section class="page-intro">
        <div class="wrap">
          <h1 class="page-title">Recupera tu contraseña</h1>
          <p class="page-subtitle">Te enviaremos un enlace para restablecerla.</p>
        </div>
      </section>
      <section class="auth-content">
        <div class="wrap auth-wrap">
          <form id="forgot-form" class="auth-form card">
            <div class="field">
              <label for="correo">Correo</label>
              <input type="email" id="correo" name="correo" placeholder="tucorreo@ejemplo.com">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Enviar enlace</button>
            <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
            <p class="auth-alt"><a href="../login/login.html">Regresar a inicio de sesión</a></p>
          </form>
        </div>
      </section>
    </main>
    <site-footer></site-footer>

    <script src="../../components/site-header/site-header.js" defer></script>
    <script src="../../components/site-footer/site-footer.js" defer></script>
    <script src="forgot-password.js" defer></script>
  </body>
</html>
